version: 2.1

# CircleCI config for paymenthub-ee-p2g.
#
# This repository holds two deployables, so it does NOT use the single-image
# template the other PHEE Java repos share: that one builds one image from one
# Dockerfile at the repository root.
#
#   p2g  Docker image  the payer side, asks for a bill and pays it
#                      (former ph-ee-bill-pay)
#   crm  Docker image  the biller side, answers what is owed and accepts the
#                      payment (former ph-ee-connector-crm)
#
# Each image is built from <module>/Dockerfile with the repository root as the
# build context, and published as <org>/paymenthub-ee-<module>, so the two keep
# separate tags on Docker Hub. Same shape as paymenthub-ee-data-pipeline.

executors:
  java-executor:
    # cimg/openjdk is built on cimg/base, which includes the Docker CLI.
    # The executor JDK only compiles the jars — the image base is set
    # independently in each module's Dockerfile.
    docker:
      - image: cimg/openjdk:21.0.6
    environment:
      JVM_OPTS: -Xmx512m
      TERM: dumb

commands:
  # The cache key follows the build scripts: any change to them re-resolves.
  restore-gradle-cache:
    steps:
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "settings.gradle" }}-{{ checksum "gradle.properties" }}-{{ checksum "p2g/build.gradle" }}-{{ checksum "crm/build.gradle" }}
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-

  common-setup:
    steps:
      - checkout
      # The jars built once by build_all; see persist_to_workspace there.
      - attach_workspace:
          at: .
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Set lowercase image name vars
          # tr for POSIX compatibility; Bash 4+ alternative: ${VAR,,}
          command: |
            echo "export DOCKER_ORG_LOWER=$(echo $CIRCLE_PROJECT_USERNAME | tr '[:upper:]' '[:lower:]')" >> $BASH_ENV
      - run:
          name: Install Docker Buildx
          command: |
            BUILDX_VERSION="v0.14.1"
            if docker buildx version 2>/dev/null | grep -q "$BUILDX_VERSION"; then
              echo "Docker Buildx $BUILDX_VERSION already present"
            else
              mkdir -vp ~/.docker/cli-plugins/
              curl --silent -L \
                "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
                -o ~/.docker/cli-plugins/docker-buildx
              chmod a+x ~/.docker/cli-plugins/docker-buildx
              docker buildx version
            fi
            docker context create buildcontext 2>/dev/null || true
            docker buildx create --name multiarch --driver docker-container --use buildcontext 2>/dev/null \
              || docker buildx use multiarch
            docker buildx inspect --bootstrap

  # One parameterised body instead of two near-identical jobs. MODULE is both the
  # Gradle project name and the image name suffix. No Gradle here: the jar comes
  # from build_all through the workspace.
  build-and-push-module-image:
    parameters:
      module:
        type: string
      tag:
        type: string
      # A second, mutable tag pushed next to `tag`. Branch builds push both
      # <branch>-<sha>, which is immutable and traceable to one commit, and
      # <branch>-latest, which is the tag the deployment values files pin.
      # Empty means one tag only.
      extra_tag:
        type: string
        default: ""
      # Release tags only: a tag already on Docker Hub must never be silently
      # overwritten by a re-run of the same tag.
      skip_if_exists:
        type: boolean
        default: false
    steps:
      - run:
          name: Build and push multi-arch image (linux/amd64 + linux/arm64)
          command: |
            IMAGE="$DOCKER_ORG_LOWER/paymenthub-ee-<< parameters.module >>"
            TAG="<< parameters.tag >>"
            EXTRA_TAG="<< parameters.extra_tag >>"

            if [ "<< parameters.skip_if_exists >>" = "true" ] && curl -s -f \
                -u "$DOCKERHUB_USERNAME":"$DOCKERHUB_PASSWORD" \
                "https://hub.docker.com/v2/repositories/$IMAGE/tags/$TAG" > /dev/null; then
              echo "Tag $TAG already exists for $IMAGE - skipping build and push."
              exit 0
            fi

            TAG_ARGS=(-t "$IMAGE:$TAG")
            if [ -n "$EXTRA_TAG" ]; then
              TAG_ARGS+=(-t "$IMAGE:$EXTRA_TAG")
            fi

            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64 \
              -f << parameters.module >>/Dockerfile \
              "${TAG_ARGS[@]}" \
              .

jobs:
  # Builds both modules with all their gates (spotless, checkstyle, Error Prone)
  # and hands the two jars to the image jobs.
  build_all:
    executor: java-executor
    steps:
      - checkout
      - restore-gradle-cache
      # --refresh-dependencies is what actually re-resolves the org.mifos
      # SNAPSHOTs (BOM, core). Deleting the cached jars is not enough on its
      # own: whether a changing module is stale is decided by the module
      # metadata cache, which is saved with the rest of ~/.gradle/caches, so
      # without the flag an old SNAPSHOT can be picked again for up to
      # Gradle's 24h TTL and its jar simply re-downloaded.
      - run:
          name: Build every module
          command: ./gradlew clean build --refresh-dependencies
      # Keep the SNAPSHOT jars out of the saved cache: they move under us and
      # everything else in there is released and safe to keep.
      - run:
          name: Drop SNAPSHOT artifacts from the cache
          command: rm -rf ~/.gradle/caches/modules-2/files-2.1/org.mifos
      - save_cache:
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "settings.gradle" }}-{{ checksum "gradle.properties" }}-{{ checksum "p2g/build.gradle" }}-{{ checksum "crm/build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: p2g/build/test-results/test
      - store_test_results:
          path: crm/build/test-results/test
      # The Dockerfiles only COPY a prebuilt jar, so the image jobs do not need
      # Gradle at all: they attach these two jars and go straight to buildx.
      - persist_to_workspace:
          root: .
          paths:
            - p2g/build/libs/app.jar
            - crm/build/libs/app.jar

  build_and_push_branch_images:
    executor: java-executor
    steps:
      - common-setup
      - run:
          name: Sanitize branch name and set commit tag
          command: |
            echo "export SANITIZED_BRANCH=$(echo $CIRCLE_BRANCH | sed 's/[^a-zA-Z0-9.-]/-/g' | tr '[:upper:]' '[:lower:]')" >> $BASH_ENV
            echo "export SHORT_SHA=$(echo $CIRCLE_SHA1 | cut -c1-7)" >> $BASH_ENV
      # Two tags per build:
      #   <branch>-<sha>     immutable, traceable to a specific commit
      #   <branch>-latest    mutable, always the most recent build on this
      #                      branch, and what the deployment values files pin
      - build-and-push-module-image:
          module: p2g
          tag: ${SANITIZED_BRANCH}-${SHORT_SHA}
          extra_tag: ${SANITIZED_BRANCH}-latest
      - build-and-push-module-image:
          module: crm
          tag: ${SANITIZED_BRANCH}-${SHORT_SHA}
          extra_tag: ${SANITIZED_BRANCH}-latest

  build_and_push_latest_images:
    executor: java-executor
    steps:
      - common-setup
      - build-and-push-module-image:
          module: p2g
          tag: latest
      - build-and-push-module-image:
          module: crm
          tag: latest

  build_and_push_tag_images:
    executor: java-executor
    steps:
      - common-setup
      - build-and-push-module-image:
          module: p2g
          tag: $CIRCLE_TAG
          skip_if_exists: true
      - build-and-push-module-image:
          module: crm
          tag: $CIRCLE_TAG
          skip_if_exists: true

workflows:
  version: 2
  build-pipeline:
    jobs:
      - build_all:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      # Release tags
      - build_and_push_tag_images:
          requires:
            - build_all
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          context:
            - DOCKER
      # Any branch commit (except the config-propagator update branches)
      - build_and_push_branch_images:
          requires:
            - build_all
          filters:
            tags:
              ignore: /.*/
            branches:
              ignore: /^ci\/mt-.*/
          context:
            - DOCKER
      # 'latest' only on main/master, after the branch images succeed
      - build_and_push_latest_images:
          requires:
            - build_and_push_branch_images
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
                - master
          context:
            - DOCKER
