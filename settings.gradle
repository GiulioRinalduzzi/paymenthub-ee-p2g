rootProject.name = 'paymenthub-ee-p2g'

// The two sides of the bill-payment flow live together, because they are only
// ever useful together: the deployed `payment_notification` process has exactly
// two service tasks, `billPay` (crm) and `billPayResponse` (p2g).
//
// Both are deployable Spring Boot applications, each with its own Dockerfile and
// its own image, built from <module>/Dockerfile with the repository root as the
// build context (see .circleci/config.yml).
//
// p2g — the payer side, the gateway that asks for a bill and pays it
//       (former ph-ee-bill-pay).
// crm — the biller side, which answers what is owed and accepts the payment
//       (former ph-ee-connector-crm).
include 'p2g'
include 'crm'
